
name: donor_app
description: A donor module of the FYP
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0

  # UI and state management
  cupertino_icons: ^1.0.2
  google_fonts: ^4.0.4
  pie_chart: ^5.3.2
  custom_navigation_bar: ^0.8.2
  pinput: ^2.2.31
  get: ^4.6.5
  provider: ^6.0.5
  modal_progress_hud_nsn: ^0.2.1
  flutter_svg: ^2.0.5
  table_calendar: ^3.0.2

  # Translation and permissions
  translator: ^1.0.4+1
  permission_handler: ^10.2.0

  # Maps and location
  google_maps_flutter: ^2.2.4
  location: ^4.4.0
  d_chart: ^2.2.11
  flutter_map: ^8.3.2
  geolocator: ^9.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - images/
    - translations/

  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-Bold.ttf
        - asset: fonts/Inter-Light.ttf
        - asset: fonts/Inter-Medium.ttf
        - asset: fonts/Inter-SemiBold.ttf
        - asset: fonts/Inter-Thin.ttf
    - family: Nastaleeq
      fonts:
        - asset: fonts/Nastaleeq.ttf